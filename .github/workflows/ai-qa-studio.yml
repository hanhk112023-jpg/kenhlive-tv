name: AI-QA-Studio

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Chế độ test (full, quick, interactive)'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - quick
  push:
    paths:
      - 'app/**'
      - 'qa/**'

jobs:
  ai_studio:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK Debug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx3g -XX:+UseParallelGC"

      - name: KVM Permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Chạy AI QA Studio trên Android TV Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86
          target: android-tv
          profile: tv_1080p
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            pip install Pillow
            python3 qa/kenhlive_ai_tester.py --full --out /tmp/ai_qa_report

      - name: Lưu trữ Báo cáo & Dashboard HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-qa-studio-report
          path: /tmp/ai_qa_report/
