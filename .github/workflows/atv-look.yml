name: ATV-Rom-Look

# Chụp multiview/player trên các ROM Android TV thật (image android-tv), nhiều API level
on:
  workflow_dispatch:

jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 34
            arch: x86   # Android 14 TV
          - api: 30
            arch: x86   # Android 11 TV
          - api: 28
            arch: x86   # Android 9 TV (box cũ)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -q

      - name: Proxy VN
        env: { SUB_URL: '${{ secrets.YUNA_SUB_URL }}', STATIC_YAML: '${{ secrets.YUNA_PROXY_YAML }}' }
        run: |
          set -euo pipefail
          VER=v1.19.30
          curl -sSL -o /tmp/mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${VER}/mihomo-linux-amd64-${VER}.gz"
          gunzip -f /tmp/mihomo.gz && sudo install -m 0750 /tmp/mihomo /usr/local/bin/mihomo
          printf '%s\n' "$STATIC_YAML" > /tmp/mihomo_ci.yaml
          nohup mihomo -f /tmp/mihomo_ci.yaml -d /tmp/mihomo_ci > /tmp/mihomo.log 2>&1 &
          sleep 4
          echo "exit IP: $(curl -sS -m 15 -x http://127.0.0.1:7891 https://api.ipify.org || echo '?')"

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Chụp màn hình ATV api ${{ matrix.api }}
        id: shot
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: android-tv
          disableAnimations: true
          script: |
            bash qa/atv_look.sh ${{ matrix.api }}

      - name: Thu ảnh (kể cả fail)
        if: always()
        run: |
          mkdir -p look_out
          cp -r /tmp/look/* look_out/ 2>/dev/null || true
          ls -la look_out/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atv-look-a${{ matrix.api }}
          path: look_out/
