name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use pre-installed Android SDK (nho setup-android@v3 — action gay preview-license loi hom 14/09)
        run: echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Build APKs
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleRelease assembleDebug --no-daemon
          if [ -f app/build/outputs/apk/release/app-universal-release.apk ]; then
            cp app/build/outputs/apk/release/app-universal-release.apk app/build/outputs/apk/release/app-release.apk
          fi
          if [ -f app/build/outputs/apk/debug/app-universal-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-universal-debug.apk app/build/outputs/apk/debug/app-debug.apk
          fi

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: socolive-tv-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kenhlive-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Prepare Release Asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp app/build/outputs/apk/release/app-release.apk "KenhLive-${{ github.ref_name }}.apk"
          if [ -f app/build/outputs/apk/release/app-armeabi-v7a-release.apk ]; then
            cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk "KenhLive-${{ github.ref_name }}-armeabi-v7a.apk"
          fi
          if [ -f app/build/outputs/apk/release/app-arm64-v8a-release.apk ]; then
            cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "KenhLive-${{ github.ref_name }}-arm64-v8a.apk"
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            KenhLive-${{ github.ref_name }}*.apk
          name: KenhLive ${{ github.ref_name }} — Apple Glassmorphism & Cinema VOD Hub
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
