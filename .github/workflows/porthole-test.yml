name: Porthole Test

# Test xác định (deterministic, không AI) bằng Porthole — giolaq/porthole:
# gắn vào emulator Android TV, mở app ra phiên web nội bộ (cổng 3200 trong runner),
# lái bằng D-pad/focus qua CLI và khẳng định bằng wait-for/focused/screenshot.
# Chạy tay (workflow_dispatch), song song với QA-Suite và Mobilerun Pilot, không thay thế chúng.

on:
  workflow_dispatch:

# Tier 1: job porthole chỉ đọc code và upload artifact, không cần ghi contents.
permissions:
  contents: read

jobs:
  porthole:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          if [ -f app/build/outputs/apk/debug/app-universal-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-universal-debug.apk app/build/outputs/apk/debug/app-debug.apk
          fi

      # proxy VN — cùng cấu hình với QA-Suite (nguồn phim chặn IP datacenter)
      - name: Set up proxy VN
        env:
          SUB_URL: ${{ secrets.YUNA_SUB_URL }}
          STATIC_YAML: ${{ secrets.YUNA_PROXY_YAML }}
        run: |
          set -euo pipefail
          MH=$(ls /usr/local/bin/mihomo 2>/dev/null || true)
          if [ -z "$MH" ]; then
            VER=v1.19.30
            curl -sSL -o /tmp/mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${VER}/mihomo-linux-amd64-${VER}.gz"
            gunzip -f /tmp/mihomo.gz && install -m 0750 /tmp/mihomo /usr/local/bin/mihomo
          fi
          if [ -n "$STATIC_YAML" ]; then
            printf '%s\n' "$STATIC_YAML" > /tmp/mihomo_ci.yaml
          else
            OK=0
            for try in 1 2 3 4; do
              if curl -sSL -m 40 -H 'User-Agent: clash-verge/1.6.6' -o /tmp/sub_full.yaml "$SUB_URL" && [ -s /tmp/sub_full.yaml ] && grep -q "proxies" /tmp/sub_full.yaml; then OK=1; break; fi
              echo "sub fetch attempt $try failed, retry in 20s"; sleep 20
            done
            [ "$OK" = "1" ] || { echo "::error::Khong tai duoc subscription Yuna sau 4 lan"; exit 1; }
            python3 qa/ci_sub_to_yaml.py
          fi
          nohup mihomo -f /tmp/mihomo_ci.yaml -d /tmp/mihomo_ci > /tmp/mihomo.log 2>&1 &
          sleep 4
          # Chờ proxy sẵn sàng và chứng minh nó qua được HTTPS trước khi tốn thời gian chạy emulator:
          # vòng lặp tối đa ~90s gọi ipify; nếu mihomo chết (subscription/node hỏng) thì fail-fast kèm log.
          READY=0
          for i in $(seq 1 9); do
            if curl -sS -m 12 -x http://127.0.0.1:7891 https://api.ipify.org > /tmp/exit_ip.txt 2>/tmp/curl_err.txt; then READY=1; break; fi
            echo "proxy chưa sẵn sàng (lần $i): $(cat /tmp/curl_err.txt)"; sleep 10
          done
          if [ "$READY" != "1" ]; then
            echo "::error::Proxy VN không qua được HTTPS sau 90s — xem mihomo log bên dưới"
            tail -30 /tmp/mihomo.log || true
            exit 1
          fi
          echo "Proxy OK, exit IP: $(cat /tmp/exit_ip.txt)"

      - name: KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Porthole
        run: |
          npm install -g portholejs
          porthole doctor || true

      - name: Chạy Porthole checks trên Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86
          target: android-tv
          profile: tv_1080p
          script: |
            adb root
            adb shell settings put global http_proxy 10.0.2.2:7891
            adb shell wm size 1920x1080
            adb shell wm density 320
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 0
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            mkdir -p qa/porthole-out
            bash qa/porthole/run_checks.sh qa/porthole-out || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: porthole-report
          path: qa/porthole-out/
