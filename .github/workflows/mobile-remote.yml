name: Mobile-Remote-Live
# Khởi chạy Android TV Emulator + Mobile Remote Server trực tiếp trên GitHub Actions runner
# Mở Cloudflare Tunnel kết nối tới điện thoại và cập nhật link ngay trong step summary + issue description

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Thời gian mở phiên điều khiển (phút)'
        required: false
        default: '60'

permissions:
  contents: write
  issues: write

jobs:
  mobile_remote:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -q

      - name: KVM Hardware Accel
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Setup cloudflared
        run: |
          curl -sSL -o /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /usr/local/bin/cloudflared

      - name: Start Mobile Server and Cloudflare Tunnel
        id: tunnel
        run: |
          python3 mobile_controller/server.py &
          sleep 2
          cloudflared tunnel --url http://127.0.0.1:8765 > /tmp/cf_tunnel.log 2>&1 &
          
          TUNNEL_URL=""
          for i in $(seq 1 20); do
            sleep 2
            TUNNEL_URL=$(grep -o 'https://[-a-z0-9.]*\.trycloudflare\.com' /tmp/cf_tunnel.log | head -1 || true)
            if [ -n "$TUNNEL_URL" ]; then break; fi
          done
          
          echo "url=$TUNNEL_URL" >> $GITHUB_OUTPUT
          echo "### 📱 LINK ĐIỀU KHIỂN TRÊN ĐIỆN THOẠI:" >> $GITHUB_STEP_SUMMARY
          echo "[Bấm vào đây để mở Remote ($TUNNEL_URL)]($TUNNEL_URL)" >> $GITHUB_STEP_SUMMARY
          echo "=========================================================="
          echo "LINK ĐIỀU KHIỂN: $TUNNEL_URL"
          echo "=========================================================="

      - name: Publish Tunnel Link to Repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ steps.tunnel.outputs.url }}
        run: |
          [ -n "$URL" ] || exit 0
          echo "Writing release asset or commit..."
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/issues/5/comments \
            -d "{\"body\":\"📱 [MOBILE_URL]: $URL\"}" || true

      - name: Launch Android TV Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86
          target: android-tv
          script: |
            adb root || true
            adb shell wm size 1920x1080
            adb shell wm density 320
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 0
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.kenhlive.tv/.MainActivity

            echo "⏳ Phiên điều khiển từ xa đang chạy (giữ phiên 60 phút)..."
            sleep 3600
