name: Screenshots

on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo gpasswd -a $USER kvm || true
          ls -l /dev/kvm

      - name: Chạy emulator + chụp 2 tab
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.kenhlive.tv/.MainActivity
            sleep 18
            adb exec-out screencap -p > shot1_tructiep.png
            adb shell input swipe 950 500 120 500 400
            sleep 12
            adb exec-out screencap -p > shot2_lichtrinh.png

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shot*.png
