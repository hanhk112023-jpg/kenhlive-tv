name: QA-Suite

on:
  workflow_dispatch:
    inputs:
      quick:
        description: 'Bỏ qua probe auto-refresh 3 phút'
        type: boolean
        default: false

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # proxy VN — json.vnres.co chặn IP datacenter
      # ƯU TIÊN node tĩnh YUNA_PROXY_YAML (không phụ thuộc dashboard.yunagrp.com — hay chết)
      - name: Set up proxy VN
        env:
          SUB_URL: ${{ secrets.YUNA_SUB_URL }}
          STATIC_YAML: ${{ secrets.YUNA_PROXY_YAML }}
        run: |
          set -euo pipefail
          MH=$(ls /usr/local/bin/mihomo 2>/dev/null || true)
          if [ -z "$MH" ]; then
            VER=v1.19.30
            curl -sSL -o /tmp/mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${VER}/mihomo-linux-amd64-${VER}.gz"
            gunzip -f /tmp/mihomo.gz && install -m 0750 /tmp/mihomo /usr/local/bin/mihomo
          fi
          if [ -n "$STATIC_YAML" ]; then
            echo "dung node tinh YUNA_PROXY_YAML"
            printf '%s\n' "$STATIC_YAML" > /tmp/mihomo_ci.yaml
          else
            OK=0
            for try in 1 2 3 4; do
              if curl -sSL -m 40 -H 'User-Agent: clash-verge/1.6.6' -o /tmp/sub_full.yaml "$SUB_URL" && [ -s /tmp/sub_full.yaml ] && grep -q "proxies" /tmp/sub_full.yaml; then OK=1; break; fi
              echo "sub fetch attempt $try failed, retry in 20s"; sleep 20
            done
            [ "$OK" = "1" ] || { echo "::error::Khong tai duoc subscription Yuna sau 4 lan"; exit 1; }
            python3 qa/ci_sub_to_yaml.py
          fi
          nohup mihomo -f /tmp/mihomo_ci.yaml -d /tmp/mihomo_ci > /tmp/mihomo.log 2>&1 &
          sleep 4
          echo "exit IP: $(curl -sS -m 15 -x http://127.0.0.1:7891 https://api.ipify.org || echo '?')"

      - name: KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install deps
        run: pip install --quiet pillow

      - name: Chạy QA Suite trên Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86
          target: android-tv
          script: |
            adb root
            adb shell settings put global http_proxy 10.0.2.2:7891
            adb shell wm size 1920x1080
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 0
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            ARGS=""
            if [ "${{ inputs.quick }}" = "true" ]; then ARGS="--quick"; fi
            python3 qa/kenhlive_qa/run_qa.py --out /tmp/qa_report $ARGS
            mkdir -p qa_out && cp -r /tmp/qa_report/* qa_out/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-report
          path: qa_out/

      - name: Kết quả
        if: always()
        run: python3 qa/ci_report.py
