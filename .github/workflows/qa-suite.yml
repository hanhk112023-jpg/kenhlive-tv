name: QA-Suite

on:
  workflow_dispatch:
    inputs:
      quick:
        description: 'Chế độ nhanh (~12-18 phút, 5 mission trọng tâm: Cold Start, Home Hub, IPTV/M3U, Phim, Player)'
        type: boolean
        default: false

# Tier 1: job QA chỉ đọc code và upload artifact, không cần ghi contents.
permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          if [ -f app/build/outputs/apk/debug/app-universal-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-universal-debug.apk app/build/outputs/apk/debug/app-debug.apk
          fi

      # proxy VN — json.vnres.co chặn IP datacenter
      # ƯU TIÊN node tĩnh YUNA_PROXY_YAML (không phụ thuộc dashboard.yunagrp.com — hay chết)
      - name: Set up proxy VN
        env:
          SUB_URL: ${{ secrets.YUNA_SUB_URL }}
          STATIC_YAML: ${{ secrets.YUNA_PROXY_YAML }}
        run: |
          set -euo pipefail
          MH=$(ls /usr/local/bin/mihomo 2>/dev/null || true)
          if [ -z "$MH" ]; then
            VER=v1.19.30
            curl -sSL -o /tmp/mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${VER}/mihomo-linux-amd64-${VER}.gz"
            gunzip -f /tmp/mihomo.gz && install -m 0750 /tmp/mihomo /usr/local/bin/mihomo
          fi
          if [ -n "$STATIC_YAML" ]; then
            echo "dung node tinh YUNA_PROXY_YAML"
            printf '%s\n' "$STATIC_YAML" > /tmp/mihomo_ci.yaml
          else
            OK=0
            for try in 1 2 3 4; do
              if curl -sSL -m 40 -H 'User-Agent: clash-verge/1.6.6' -o /tmp/sub_full.yaml "$SUB_URL" && [ -s /tmp/sub_full.yaml ] && grep -q "proxies" /tmp/sub_full.yaml; then OK=1; break; fi
              echo "sub fetch attempt $try failed, retry in 20s"; sleep 20
            done
            [ "$OK" = "1" ] || { echo "::error::Khong tai duoc subscription Yuna sau 4 lan"; exit 1; }
            python3 qa/ci_sub_to_yaml.py
          fi
          nohup mihomo -f /tmp/mihomo_ci.yaml -d /tmp/mihomo_ci > /tmp/mihomo.log 2>&1 &
          sleep 4
          echo "exit IP: $(curl -sS -m 15 -x http://127.0.0.1:7891 https://api.ipify.org || echo '?')"

      - name: KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install deps
        run: |
          sudo apt-get update -qq -o Acquire::http::Timeout=20 -o Acquire::Retries=3
          sudo apt-get install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-vie
          pip install --quiet pillow pytesseract

      # AI Brain chính: Meteor gateway (OpenAI-compatible). Key nằm trong secret METEOR_API_KEY.
      # Preflight chạy trên runner (mạng mở): liệt kê model, tự chọn model vision tốt nhất
      # và bắn thử 1 chat completion để fail-fast trước khi tốn thời gian dựng emulator.
      - name: Preflight Meteor AI (chọn model + kiểm tra key)
        env:
          METEOR_API_KEY: ${{ secrets.METEOR_API_KEY }}
          METEOR_API_BASE: http://meteor.pikamc.vn:25155/v1
        run: |
          set -euo pipefail
          echo "Lấy danh sách model từ Meteor..."
          curl -sS -m 30 -H "Authorization: Bearer $METEOR_API_KEY" "$METEOR_API_BASE/models" -o /tmp/models.json
          head -c 2000 /tmp/models.json; echo
          MODEL=$(python3 - << 'PYEOF'
          import json, sys
          try:
              ids = [m.get("id", "") for m in json.load(open("/tmp/models.json")).get("data", [])]
          except Exception as e:
              print(f"models parse error: {e}", file=sys.stderr); ids = []
          print("MODELS: " + ", ".join(ids), file=sys.stderr)
          # Ưu tiên tuyệt đối theo yêu cầu của Ramirez: Gemini 3.8 Flash bản High
          g38 = [i for i in ids if "gemini-3.8-flash" in i.lower()]
          if g38:
              high = [i for i in g38 if "high" in i.lower()]
              picked = high[0] if high else g38[0]
          else:
              pref = ["gpt-4o", "gpt-4o-mini", "gemini-2.5-flash", "gemini-2.0-flash", "claude-sonnet-4-5", "deepseek-chat"]
              picked = next((p for p in pref if p in ids), "")
              if not picked:
                  vis = [i for i in ids if "gpt-4o" in i or "gemini" in i or "claude" in i]
                  picked = vis[0] if vis else (ids[0] if ids else "")
          print(picked)
          PYEOF
          )
          [ -n "$MODEL" ] || { echo "::error::Không chọn được model từ Meteor"; exit 1; }
          echo "AI_MODEL=$MODEL" >> "$GITHUB_ENV"
          echo "Model AI QA được chọn: $MODEL"
          echo "Kiểm tra chat completion..."
          curl -sS -m 40 -H "Authorization: Bearer $METEOR_API_KEY" -H "Content-Type: application/json" \
            -d "{\"model\":\"$MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"Tra loi dung mot tu: OK\"}],\"max_tokens\":8}" \
            "$METEOR_API_BASE/chat/completions" | head -c 600; echo

      - name: Chạy QA Suite trên Android TV emulator
        env:
          # Meteor là AI Brain DUY NHẤT: các gateway cũ để trống có chủ đích để
          # AIBrain._detect_provider chọn OPENAI (Meteor) làm engine chính.
          DEEPSEEK_API_BASE: ""
          ANTIGRAVITY_API_BASE: ""
          ANTIGRAVITY_API_KEY: ""
          KILO_API_KEY: ""
          OPENAI_API_BASE: http://meteor.pikamc.vn:25155/v1
          OPENAI_API_KEY: ${{ secrets.METEOR_API_KEY }}
          OPENAI_MODEL: ${{ env.AI_MODEL }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86
          target: android-tv
          profile: tv_1080p
          script: |
            adb root
            adb shell settings put global http_proxy 10.0.2.2:7891
            adb shell wm size 1920x1080
            adb shell wm density 320
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 0
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            # Launcher rieng cho test (module :testlauncher): HOME duy nhat, khong
            # co YouTube de script bam mu lac sang (bai hoc UI-Tour 2026-11-05).
            adb install -r testlauncher/build/outputs/apk/debug/testlauncher-debug.apk || true
            adb shell pm disable-user com.google.android.youtube.tv >/dev/null 2>&1 || true
            adb shell pm disable-user com.google.android.youtube.tv.kids >/dev/null 2>&1 || true
            adb shell cmd package set-home-activity com.kenhlive.testlauncher/com.kenhlive.testlauncher.TestLauncherActivity >/dev/null 2>&1 || true
            adb logcat -c
            ARGS=""
            if [ "${{ inputs.quick }}" = "true" ]; then ARGS="--quick"; fi
            mkdir -p qa_out /tmp/qa_report
            python3 qa/kenhlive_qa/run_qa.py --out qa_out $ARGS || true
            cp -r qa_out/* /tmp/qa_report/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-report
          path: qa_out/

      - name: Kết quả
        if: always()
        run: python3 qa/ci_report.py
