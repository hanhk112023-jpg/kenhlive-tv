name: Screenshots-TV

on:
  workflow_dispatch:

jobs:
  tvshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # dùng image ANDROID TV (leanback) — không phải phone
      - name: Chạy Android TV emulator + chụp
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          # TV image: leanback landscape 16:9
          image: android-tv-google_apis
          target: android-tv
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            # mở app (TV: dùng LEANBACK_LAUNCHER)
            adb shell am start -W -n com.kenhlive.tv/.MainActivity
            sleep 26
            adb shell "dumpsys window | grep mCurrentFocus"
            adb exec-out screencap -p > tv1_home.png
            # D-pad: di chuyển xuống + phải (hero/rows) rồi chụp nav
            adb shell input keyevent 20   # DOWN
            adb shell input keyevent 22   # RIGHT
            sleep 3
            adb exec-out screencap -p > tv2_rows.png
            # chuyển tab Lịch trình qua intent
            adb shell am force-stop com.kenhlive.tv
            sleep 2
            adb shell am start -n com.kenhlive.tv/.MainActivity --ei tab 1
            sleep 22
            adb exec-out screencap -p > tv3_schedule.png
            adb logcat -d -s AndroidRuntime:E > crashlog.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: tv-screenshots
          path: |
            tv*.png
            crashlog.txt
