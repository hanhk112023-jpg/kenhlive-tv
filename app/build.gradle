plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.kenhlive.tv'
    compileSdk 34

    // Tier 1: keystore thật KHÔNG có trong git — CI cung cấp qua secret
    // KEYSTORE_B64 (file) + KEYSTORE_PASSWORD (pass). Không còn tự sinh
    // keystore, không còn mật khẩu mặc định. Bản debug dùng keystore debug
    // mặc định của AGP; bản release chỉ ký được khi có keystore thật và
    // mật khẩu thật, nếu không task đóng gói release sẽ fail rõ ràng ở dưới.
    def ksFile = rootProject.file('keystore/kenhlive.jks')
    def ksB64 = (System.getenv('KEYSTORE_B64') ?: '').trim()
    if (ksB64) {
        ksFile.parentFile.mkdirs()
        ksFile.bytes = Base64.decoder.decode(ksB64)
    }
    def ksPass = (System.getenv('KEYSTORE_PASSWORD') ?: '').trim()
    // Release signing chỉ sẵn sàng khi có cả file keystore và mật khẩu thật.
    // Lưu ý: file keystore đặt tay ở local (không commit) cũng được chấp nhận,
    // nhưng mật khẩu vẫn bắt buộc phải qua biến môi trường.
    def releaseSigningReady = ksFile.exists() && !ksPass.isEmpty()
    signingConfigs {
        kenhliveRelease {
            storeFile ksFile
            storePassword ksPass
            keyAlias 'kenhlive'
            keyPassword ksPass
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }
    // Fail-closed cho release: task đóng gói release kiểm tra trước khi chạy.
    // Debug và các task khác không bị ảnh hưởng khi thiếu keystore release.
    tasks.configureEach { t ->
        if (t.name.startsWith('package') && t.name.contains('Release')) {
            t.doFirst {
                if (!releaseSigningReady) {
                    throw new GradleException(
                        'Release signing is not configured: provide a real keystore ' +
                        'via KEYSTORE_B64 (CI) or keystore/kenhlive.jks (local, not in git) ' +
                        'AND set KEYSTORE_PASSWORD. Refusing to build an unsigned or ' +
                        'default-password release APK.'
                    )
                }
            }
        }
    }

    defaultConfig {
        applicationId "com.kenhlive.tv"
        minSdk 21
        targetSdk 34
        versionCode 162
        versionName "0.1.12"
        // Bản APK Universal: Gộp chung cả 32-bit (armeabi-v7a) và 64-bit (arm64-v8a) vào 1 file APK duy nhất
        // tương thích mọi dòng Android TV Box từ chip 32-bit cũ đến 64-bit đời mới, cài đè không mất dữ liệu.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    // v7.9: Tách APK theo kiến trúc để mỗi máy chỉ tải đúng phần của mình (giảm ~25-40% dung lượng tải).
    // Vẫn xuất thêm bản Universal cho kênh cập nhật OTA (workers.dev/apk) và máy chưa rõ kiến trúc.
    // CI (build.yml) đã có sẵn bước đóng gói riêng app-armeabi-v7a-release.apk / app-arm64-v8a-release.apk.
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk true
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            // Tách debug/release: debug dùng keystore debug mặc định của AGP.
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Release chỉ dùng keystore thật; thiếu thì task package*Release
            // fail rõ ràng ở khối kiểm tra trên, không ký mù bằng keystore tạm.
            signingConfig signingConfigs.kenhliveRelease
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    lint {
        abortOnError false
    }
    buildFeatures {
        buildConfig true
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // lifecycle: ViewModel + StateFlow + lifecycleScope (state management chuẩn)
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'

    // Media3 ExoPlayer (HLS playback)
    implementation 'androidx.media3:media3-exoplayer:1.3.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.0'
    implementation 'androidx.media3:media3-ui:1.3.0'

    // Material (dialogs, ripple)
    implementation 'com.google.android.material:material:1.11.0'

    // coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Coil — nhẹ hơn Glide, Kotlin-first
    implementation 'io.coil-kt:coil:2.5.0'

    // BUG-09: network khai báo tường minh (repository + UpdateManager)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
}
