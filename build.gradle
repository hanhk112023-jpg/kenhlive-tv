// Top-level build file
plugins {
    id 'com.android.application' apply false
    id 'org.jetbrains.kotlin.android' apply false
}

// ---------------------------------------------------------------------------
// CI DIAGNOSTICS (Tier 1): khi build FAIL trong GitHub Actions, chỉ ghi
// log lỗi vào GITHUB_STEP_SUMMARY. Không còn đẩy log lên nhánh khác bằng
// token, vì log chẩn đoán có thể chứa secret và việc đẩy từ trong build
// là kênh rò rỉ khó kiểm soát.
// ---------------------------------------------------------------------------
if (System.getenv('GITHUB_REPOSITORY') != null) {
    def errBuf = new StringBuilder()
    def listener = { String chunk ->
        if (errBuf.length() < 30000) errBuf.append(chunk)
    } as org.gradle.api.logging.StandardOutputListener
    def errListener = { String chunk ->
        if (errBuf.length() < 30000) errBuf.append(chunk)
    } as org.gradle.api.logging.StandardOutputListener

    allprojects { p ->
        p.tasks.configureEach { t ->
            def n = t.name
            if (n.contains('ompile') || n.contains('otlin') || n.contains('esource') ||
                n.contains('apt') || n.contains('erge') || n.contains('int') || n.contains('est')) {
                try {
                    t.logging.addStandardOutputListener(listener)
                    t.logging.addStandardErrorListener(errListener)
                } catch (ignored) { }
            }
        }
    }

    gradle.buildFinished { result ->
        if (result.failure == null) return
        def detail = errBuf.toString()
        if (detail.trim().isEmpty()) detail = String.valueOf(result.failure)
        // 1) step summary (đọc được qua Checks API output.summary — không cần token)
        try {
            def sumPath = System.getenv('GITHUB_STEP_SUMMARY')
            if (sumPath) {
                new File(sumPath).withWriterAppend('UTF-8') { w ->
                    w.write("## BUILD FAILURE DIAG\n```\n" + detail.take(20000) + "\n```\n")
                }
            }
        } catch (ignored) { }
        // Tier 1: dừng tại đây — không đẩy log lên nhánh khác.
    }
}
